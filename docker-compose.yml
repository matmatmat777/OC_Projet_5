version: "3.9"

services:
  mongo:
    image: mongo:latest
    container_name: mon_mongo_projet_5
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
      - MONGO_INITDB_DATABASE=${MONGO_INITDB_DATABASE}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  python_app:
    build: .
    container_name: python_projet_5
    depends_on:
      - mongo
    volumes:
      - ./archive:/app/archive
    environment:
      - MONGO_URI=${MONGO_URI}
    command: python import_healthcare_mongo.py

volumes:
  mongo_data:
